name: Validate config

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"
      - run: npm exec --package "https://github.com/dots-suite/dots-vue-config-validator" validate -- --generic-config custom.conf.json
      - run: GLOBIGNORE="custom.*";npm exec --package "https://github.com/dots-suite/dots-vue-config-validator" validate -- *.conf.json
